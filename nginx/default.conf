log_format livetraffic '$request_method $uri $status ${request_time}s';

upstream analytics_api {
    zone analytics_api 64k;
    # Resolve the service name again when Compose replaces the API container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8080 resolve;
}

server {
    listen 80;
    server_name _;
    access_log /dev/stdout livetraffic;

    location / {
        proxy_pass http://analytics_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
}
