version: "3.8"

services:
  api:
    environment:
      LIVETRAFFIC_DASHBOARD_USER: ${LIVETRAFFIC_DASHBOARD_USER:-analyst}
      LIVETRAFFIC_DASHBOARD_PASSWORD_FILE: /run/secrets/dashboard_password
    secrets:
      - dashboard_password

secrets:
  dashboard_password:
    external: true
    name: ${LIVETRAFFIC_DASHBOARD_SECRET:-livetraffic-dashboard-password}
