name: livetraffic

x-app: &app
  image: livetraffic-app:local
  restart: unless-stopped
  volumes:
    - analytics-data:/data
  logging: &logs
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *app
    build: .
    command: ["server"]
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  worker:
    <<: *app
    pull_policy: never
    command: ["worker"]
    network_mode: none
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    logging: *logs
    ports:
      - "127.0.0.1:${LIVETRAFFIC_PORT:-8081}:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    networks: [web]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

networks:
  web:

volumes:
  analytics-data:
